<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShareCalc - 쉐어하우스 공용비용 정산기</title>
    <meta name="description" content="쉐어하우스 공용비용을 입주일 기준으로 공정하게 정산하세요. 일할 계산으로 정확한 비용 분담.">
    <!-- 이모지 파비콘: 별도 파일 없이 브라우저 탭에 아이콘 표시 -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏠</text></svg>">
    <!-- Pretendard 폰트: 한국어에 최적화된 깔끔한 폰트 -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>
    <div class="container">
        <!-- 헤더: 서비스 브랜딩 -->
        <header class="header">
            <h1 class="logo">ShareCalc</h1>
            <p class="subtitle">쉐어하우스 공용비용 정산기</p>
        </header>

        <main>
            <!-- ============================================ -->
            <!-- 1단계: 입주자 정보 입력 -->
            <!-- ============================================ -->
            <section class="card">
                <div class="card-header">
                    <span class="step-badge">1</span>
                    <h2>입주자 정보</h2>
                </div>
                <p class="card-desc">이름과 거주 기간을 입력하세요. 현재 거주 중이면 퇴실일을 비워두세요.</p>

                <!-- 입주자 목록이 여기에 동적으로 렌더링됩니다 -->
                <div id="residents-list" class="form-list"></div>

                <button type="button" class="btn btn-add" id="add-resident-btn">
                    <span class="btn-icon">+</span> 입주자 추가
                </button>
            </section>

            <!-- ============================================ -->
            <!-- 2단계: 공용비용 입력 -->
            <!-- ============================================ -->
            <section class="card">
                <div class="card-header">
                    <span class="step-badge">2</span>
                    <h2>공용비용 입력</h2>
                </div>
                <p class="card-desc">항목별 금액과 청구 기간을 입력하세요. 항목마다 청구 기간이 달라도 됩니다.</p>

                <!-- 영수증/청구서 업로드 영역 -->
                <div class="ocr-upload" id="ocr-upload-area">
                    <input type="file" id="ocr-file-input" accept="image/*" multiple hidden>
                    <div class="ocr-upload__dropzone" id="ocr-dropzone">
                        <div class="ocr-upload__icon">&#128247;</div>
                        <p class="ocr-upload__text">영수증·청구서 이미지를 여기에 드래그하거나 클릭하여 업로드</p>
                        <p class="ocr-upload__hint">이미지에서 항목명, 금액, 청구기간을 자동으로 인식합니다</p>
                    </div>
                    <div class="ocr-progress" id="ocr-progress" style="display:none;">
                        <div class="ocr-progress__bar">
                            <div class="ocr-progress__fill" id="ocr-progress-fill"></div>
                        </div>
                        <p class="ocr-progress__text" id="ocr-progress-text">이미지 분석 중...</p>
                    </div>
                    <div class="ocr-preview-list" id="ocr-preview-list"></div>
                </div>

                <!-- 비용 항목 목록이 여기에 동적으로 렌더링됩니다 -->
                <div id="expenses-list" class="form-list"></div>

                <button type="button" class="btn btn-add" id="add-expense-btn">
                    <span class="btn-icon">+</span> 비용 항목 추가
                </button>
            </section>

            <!-- 정산하기 버튼 -->
            <button type="button" class="btn btn-primary btn-calculate" id="calculate-btn">
                정산하기
            </button>

            <!-- ============================================ -->
            <!-- 3단계: 정산 결과 -->
            <!-- ============================================ -->
            <section class="card" id="results-section" style="display: none;">
                <div class="card-header">
                    <span class="step-badge step-badge--success">3</span>
                    <h2>정산 결과</h2>
                </div>

                <!-- 결과가 여기에 동적으로 렌더링됩니다 -->
                <div id="results-content"></div>

                <!-- 결과 복사 버튼: 카카오톡 등으로 공유할 때 사용 -->
                <div class="results-actions">
                    <button type="button" class="btn btn-secondary" id="copy-btn">
                        결과 복사하기
                    </button>
                    <button type="button" class="btn btn-secondary" id="download-image-btn">
                        이미지 저장하기
                    </button>
                </div>
            </section>
        </main>

        <!-- 하단 푸터 -->
        <footer class="footer">
            <p>&copy; 2026 ShareCalc &middot; 쉐어하우스 운영을 더 쉽게</p>
            <button type="button" class="btn-link" id="reset-btn">데이터 초기화</button>
        </footer>
    </div>

    <!-- 토스트 알림: 복사 완료 등의 피드백 메시지 표시 -->
    <div id="toast" class="toast" aria-live="polite"></div>

    <script src="js/app.js"></script>
</body>
</html>
