<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShareCalc - 쉐어하우스 공용비용 정산기</title>
    <meta name="description" content="쉐어하우스 공용비용을 입주일 기준으로 공정하게 정산하세요. 일할 계산으로 정확한 비용 분담.">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏠</text></svg>">
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- ============================================ -->
    <!-- 인증 화면 (로그인/회원가입) -->
    <!-- ============================================ -->
    <div id="auth-screen" class="auth-screen">
        <div class="auth-card">
            <h1 class="logo">ShareCalc</h1>
            <p class="subtitle">쉐어하우스 공용비용 정산기</p>

            <div id="auth-error" class="auth-error" aria-live="polite"></div>

            <!-- 로그인 폼 -->
            <div id="login-form" class="auth-form">
                <div class="field">
                    <label for="login-name">이름</label>
                    <input type="text" id="login-name" placeholder="이름을 입력하세요" autocomplete="username">
                </div>
                <div class="field">
                    <label for="login-pass">비밀번호</label>
                    <input type="password" id="login-pass" placeholder="비밀번호를 입력하세요" autocomplete="current-password">
                </div>
                <button type="button" class="btn btn-primary auth-submit" id="login-submit">로그인</button>
                <p class="auth-toggle">계정이 없으신가요? <button type="button" class="btn-link" id="toggle-auth-mode">회원가입</button></p>
            </div>

            <!-- 회원가입 폼 -->
            <div id="signup-form" class="auth-form" style="display:none;">
                <div class="field">
                    <label for="signup-name">이름</label>
                    <input type="text" id="signup-name" placeholder="사용할 이름을 입력하세요" autocomplete="username">
                </div>
                <div class="field">
                    <label for="signup-pass">비밀번호</label>
                    <input type="password" id="signup-pass" placeholder="4자 이상 비밀번호" autocomplete="new-password">
                </div>
                <button type="button" class="btn btn-primary auth-submit" id="signup-submit">회원가입</button>
                <p class="auth-toggle">이미 계정이 있으신가요? <button type="button" class="btn-link" id="toggle-auth-mode-2">로그인</button></p>
            </div>
        </div>
    </div>

    <!-- ============================================ -->
    <!-- 메인 앱 화면 (로그인 후) -->
    <!-- ============================================ -->
    <div id="app-screen" class="container" style="display:none;">
        <!-- 헤더 -->
        <header class="header">
            <div class="header-top">
                <h1 class="logo">ShareCalc</h1>
                <div class="header-actions">
                    <span class="user-badge" id="current-user-name"></span>
                    <button type="button" class="btn-icon-only" id="dark-mode-btn" title="다크모드 전환" aria-label="다크모드 전환">
                        <span id="dark-mode-icon">&#9790;</span>
                    </button>
                    <button type="button" class="btn-icon-only" id="logout-btn" title="로그아웃" aria-label="로그아웃">
                        &#x2192;
                    </button>
                </div>
            </div>
            <p class="subtitle">쉐어하우스 공용비용 정산기</p>
        </header>

        <!-- 지점 선택 -->
        <div class="house-selector" id="house-selector">
            <div class="house-selector__list" id="house-list"></div>
            <button type="button" class="house-selector__add" id="add-house-btn" title="지점 추가">+</button>
        </div>

        <!-- 탭 네비게이션 -->
        <nav class="tabs" role="tablist">
            <button type="button" class="tab tab--active" id="tab-calculator" role="tab" aria-selected="true">정산기</button>
            <button type="button" class="tab" id="tab-history" role="tab" aria-selected="false">정산 이력</button>
        </nav>

        <!-- ============================================ -->
        <!-- 정산기 탭 -->
        <!-- ============================================ -->
        <main id="calculator-content">
            <section class="card" aria-labelledby="step1-title">
                <div class="card-header">
                    <span class="step-badge" aria-hidden="true">1</span>
                    <h2 id="step1-title">입주자 정보</h2>
                </div>
                <p class="card-desc">이름과 거주 기간을 입력하세요. 현재 거주 중이면 퇴실일을 비워두세요.</p>
                <div id="residents-list" class="form-list"></div>
                <div class="btn-group">
                    <button type="button" class="btn btn-add" id="add-resident-btn">
                        <span class="btn-icon">+</span> 입주자 추가
                    </button>
                    <button type="button" class="btn btn-sample" id="sample-data-btn" title="예시 데이터로 채우기">
                        예시 데이터
                    </button>
                </div>
            </section>

            <section class="card" aria-labelledby="step2-title">
                <div class="card-header">
                    <span class="step-badge" aria-hidden="true">2</span>
                    <h2 id="step2-title">공용비용 입력</h2>
                </div>
                <p class="card-desc">항목별 금액과 청구 기간을 입력하세요. 항목마다 청구 기간이 달라도 됩니다.</p>
                <div id="expenses-list" class="form-list"></div>
                <button type="button" class="btn btn-add" id="add-expense-btn">
                    <span class="btn-icon">+</span> 비용 항목 추가
                </button>
            </section>

            <button type="button" class="btn btn-primary btn-calculate" id="calculate-btn">
                정산하기
            </button>

            <section class="card" id="results-section" style="display: none;" aria-labelledby="step3-title" aria-live="polite">
                <div class="card-header">
                    <span class="step-badge step-badge--success" aria-hidden="true">3</span>
                    <h2 id="step3-title">정산 결과</h2>
                </div>
                <div id="results-content"></div>
                <div class="results-actions">
                    <button type="button" class="btn btn-secondary" id="copy-btn">
                        결과 복사하기
                    </button>
                </div>
            </section>
        </main>

        <!-- ============================================ -->
        <!-- 정산 이력 탭 -->
        <!-- ============================================ -->
        <section id="history-section" style="display:none;">
            <div class="card">
                <div class="card-header">
                    <h2>정산 이력</h2>
                </div>
                <p class="card-desc">정산할 때마다 자동으로 이력이 저장됩니다. 이전 데이터를 다시 불러올 수 있습니다.</p>
                <div id="history-content"></div>
            </div>
        </section>

        <!-- 푸터 -->
        <footer class="footer">
            <p>&copy; 2026 ShareCalc &middot; 쉐어하우스 운영을 더 쉽게</p>
            <div class="footer-actions">
                <button type="button" class="btn-link" id="export-btn">데이터 내보내기</button>
                <label class="btn-link import-label" tabindex="0" role="button">
                    데이터 가져오기
                    <input type="file" accept=".json" id="import-input" class="sr-only">
                </label>
                <button type="button" class="btn-link btn-link--danger" id="reset-btn">데이터 초기화</button>
            </div>
        </footer>
    </div>

    <div id="toast" class="toast" aria-live="polite"></div>
    <script src="js/app.js"></script>
</body>
</html>
