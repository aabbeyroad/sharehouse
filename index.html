<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShareCalc - 쉐어하우스 공용비용 정산기</title>
    <meta name="description" content="쉐어하우스 공용비용을 입주일 기준으로 공정하게 정산하세요. 일할 계산으로 정확한 비용 분담.">
    <!-- 이모지 파비콘: 별도 파일 없이 브라우저 탭에 아이콘 표시 -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏠</text></svg>">
    <!-- Pretendard 폰트: 한국어에 최적화된 깔끔한 폰트 -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <!-- 헤더: 서비스 브랜딩 -->
        <header class="header">
            <div class="header-top">
                <h1 class="logo">ShareCalc</h1>
                <button type="button" class="btn-icon-only" id="dark-mode-btn" title="다크모드 전환" aria-label="다크모드 전환">
                    <span id="dark-mode-icon">&#9790;</span>
                </button>
            </div>
            <p class="subtitle">쉐어하우스 공용비용 정산기</p>
        </header>

        <main>
            <!-- ============================================ -->
            <!-- 1단계: 입주자 정보 입력 -->
            <!-- ============================================ -->
            <section class="card" aria-labelledby="step1-title">
                <div class="card-header">
                    <span class="step-badge" aria-hidden="true">1</span>
                    <h2 id="step1-title">입주자 정보</h2>
                </div>
                <p class="card-desc">이름과 거주 기간을 입력하세요. 현재 거주 중이면 퇴실일을 비워두세요.</p>

                <!-- 입주자 목록이 여기에 동적으로 렌더링됩니다 -->
                <div id="residents-list" class="form-list"></div>

                <div class="btn-group">
                    <button type="button" class="btn btn-add" id="add-resident-btn">
                        <span class="btn-icon">+</span> 입주자 추가
                    </button>
                    <button type="button" class="btn btn-sample" id="sample-data-btn" title="예시 데이터로 채우기">
                        예시 데이터
                    </button>
                </div>
            </section>

            <!-- ============================================ -->
            <!-- 2단계: 공용비용 입력 -->
            <!-- ============================================ -->
            <section class="card" aria-labelledby="step2-title">
                <div class="card-header">
                    <span class="step-badge" aria-hidden="true">2</span>
                    <h2 id="step2-title">공용비용 입력</h2>
                </div>
                <p class="card-desc">항목별 금액과 청구 기간을 입력하세요. 항목마다 청구 기간이 달라도 됩니다.</p>

                <!-- 비용 항목 목록이 여기에 동적으로 렌더링됩니다 -->
                <div id="expenses-list" class="form-list"></div>

                <button type="button" class="btn btn-add" id="add-expense-btn">
                    <span class="btn-icon">+</span> 비용 항목 추가
                </button>
            </section>

            <!-- 정산하기 버튼 -->
            <button type="button" class="btn btn-primary btn-calculate" id="calculate-btn">
                정산하기
            </button>

            <!-- ============================================ -->
            <!-- 3단계: 정산 결과 -->
            <!-- ============================================ -->
            <section class="card" id="results-section" style="display: none;" aria-labelledby="step3-title" aria-live="polite">
                <div class="card-header">
                    <span class="step-badge step-badge--success" aria-hidden="true">3</span>
                    <h2 id="step3-title">정산 결과</h2>
                </div>

                <!-- 결과가 여기에 동적으로 렌더링됩니다 -->
                <div id="results-content"></div>

                <!-- 결과 복사 버튼: 카카오톡 등으로 공유할 때 사용 -->
                <div class="results-actions">
                    <button type="button" class="btn btn-secondary" id="copy-btn">
                        결과 복사하기
                    </button>
                </div>
            </section>
        </main>

        <!-- 하단 푸터 -->
        <footer class="footer">
            <p>&copy; 2026 ShareCalc &middot; 쉐어하우스 운영을 더 쉽게</p>
            <div class="footer-actions">
                <button type="button" class="btn-link" id="export-btn">데이터 내보내기</button>
                <label class="btn-link import-label" tabindex="0" role="button">
                    데이터 가져오기
                    <input type="file" accept=".json" id="import-input" class="sr-only">
                </label>
                <button type="button" class="btn-link btn-link--danger" id="reset-btn">데이터 초기화</button>
            </div>
        </footer>
    </div>

    <!-- 토스트 알림: 복사 완료 등의 피드백 메시지 표시 -->
    <div id="toast" class="toast" aria-live="polite"></div>

    <script src="js/app.js"></script>
</body>
</html>
